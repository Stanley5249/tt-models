[project]
name = "tt-models"
version = "0.1.0"
description = "Tenstorrent model implementations served through vLLM and vllm-tt-plugin"
requires-python = ">=3.12"
# The runtime stack (ttnn, torch, vLLM, vllm-tt-plugin) is pinned under [tool.pixi].
dependencies = []

# vLLM loads this in every process: the model classes and the gemma4_tt tool parser.
[project.entry-points."vllm.general_plugins"]
tt_models = "tt_models.vllm_plugin:register"

[build-system]
requires = ["uv_build>=0.9.0"]
build-backend = "uv_build"

[tool.pixi.workspace]
channels = ["conda-forge"]
requires-pixi = ">=0.81"
# The ttnn wheel needs glibc 2.34; Ubuntu 22.04 has 2.35.
platforms = [{ platform = "linux-64", glibc = "2.34" }]

# tt-metal needs libhwloc, libnuma, and libstdc++ with GLIBCXX_3.4.32.
# The bundled SFPI compiler needs mpc and zstd.
[tool.pixi.dependencies]
python = "3.12.*"
libstdcxx = ">=13"
libhwloc = "*"
libnuma = "*"
mpc = "*"
zstd = "*"

[tool.pixi.activation.env]
LD_LIBRARY_PATH = "$CONDA_PREFIX/lib"
# tt-metal's fabric, inspector, and watcher logs; without it they land in
# generated/ under the working directory.
TT_METAL_LOGS_PATH = "$PIXI_PROJECT_ROOT/logs/tt-metal"
# Selects the build target vLLM's setup.py declares requirements for.
VLLM_TARGET_DEVICE = "empty"
# The wheel's kernels, firmware, and Tracy tools; tt-scope reads these.
TT_METAL_RUNTIME_ROOT = "$CONDA_PREFIX/lib/python3.12/site-packages/ttnn/"
TT_METAL_HOME = "$CONDA_PREFIX/lib/python3.12/site-packages/ttnn"
TT_METAL_PROFILER_DIR = "$PIXI_PROJECT_ROOT/artifacts/profiler"

[tool.pixi.pypi-dependencies]
# This repository's package (src/tt_models), editable.
tt-models = { path = ".", editable = true }
# Test runner: `pytest` for host checks, `pytest -m device` for the N300 ones.
pytest = "*"
# Stanley5249/tt-metal release: Tracy-enabled ttnn with SFPI and tt_transformers' models/.
ttnn = { url = "https://github.com/Stanley5249/tt-metal/releases/download/v0.81.1-conda.8/ttnn-0.81.1%2Bconda.8-cp312-cp312-linux_x86_64.whl" }
# The torch pair tt-metal 0.81 is tested with, as CPU builds: PyPI's Linux
# torch is the CUDA build.
torch = { version = "==2.11.*", index = "https://download.pytorch.org/whl/cpu" }
torchvision = { version = "==0.26.*", index = "https://download.pytorch.org/whl/cpu" }
# PyPI's vLLM wheels are CUDA builds, its CPU wheels since 0.30 need glibc 2.39,
# and its sdist states the CUDA requirements statically. A git checkout makes
# the resolver build the metadata, which lists requirements/common.txt.
vllm = { git = "https://github.com/vllm-project/vllm.git", tag = "v0.32.0" }
# Profiling front end (tracy, memory, noc, serve captures); same fork ttnn as above.
tt-scope = { git = "https://github.com/Stanley5249/tt-scope.git", tag = "v0.4.0" }
# Follows plugin main; pixi.lock holds the commit until `pixi update vllm-tt-plugin`.
vllm-tt-plugin = { git = "https://github.com/tenstorrent/vllm-tt-plugin.git", branch = "main" }

# No numpy override: an override replaces every package's numpy requirement,
# so the resolver could then pick packages that need numpy 2. Without one,
# ttnn's numpy<2 holds and the rest resolve to releases that accept numpy 1.
[tool.pixi.pypi-options.dependency-overrides]
# vLLM asks for >=4.13, which needs numpy 2 (vllm-tt-plugin docs/vllm-overrides.txt).
opencv-python-headless = "==4.11.*"
# vllm-tt-plugin's supported range (docs/vllm-overrides.txt).
transformers = ">=5.16.1,<5.17"
# vLLM 0.32 pins 0.2.8; 0.2.9 adds the gemma_4 structural tag (Gemma 4's
# <|"|> string syntax) that src/tt_models/models/gemma4/tool_parser.py uses for required and
# named tool choice. The API is otherwise unchanged.
xgrammar = "==0.2.9"

# Command-line tools the justfile and CI call, in their own environment so
# their pins never move the runtime libraries. oxfmt runs through bunx.
[tool.pixi.feature.tools.dependencies]
just = "*"
ruff = "*"
tombi = "*"
pyrefly = "*"

[tool.pixi.environments]
tools = { features = ["tools"], no-default-feature = true }

[tool.pyrefly]
preset = "strict"
project-includes = ["src", "scripts", "tests"]
# The tools environment has no runtime packages; resolve imports in the default one.
python-interpreter-path = ".pixi/envs/default/bin/python"
# ttnn registers its ops at import time, so static analysis sees few of its
# attributes; treat it as untyped rather than report every op.
replace-imports-with-any = ["ttnn", "ttnn.*"]
# Scripts import their siblings, as Python does when it runs them.
search-path = ["src", "scripts/accuracy", "scripts/serve"]

# Not yet fixed; remove one kind per change.
[tool.pyrefly.errors]
implicit-any-parameter = false
implicit-any-type-argument = false
missing-attribute = false
implicit-any-empty-container = false
unbound-name = false
bad-argument-type = false
implicit-any-lambda = false
missing-import = false
bad-assignment = false
bad-return = false
not-callable = false
possibly-uninitialized-attribute = false
implicit-any-attribute = false
method-assign = false
unsupported-operation = false

[tool.pytest.ini_options]
addopts = "-m 'not device'"
markers = ["device: needs the N300 (run with `pytest -m device`)"]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",  # conflicts with the formatter
  "CPY001",  # no per-file copyright headers
  "FBT003",  # ttnn's API takes positional booleans
  "B905",  # the zips pair sequences built to the same length
  "E741",  # H, I and E name model dimensions, as in the checkpoint config
  "N806",  # the same dimension names as locals
  "PLR2004",  # tile sizes and hardware constants read better inline
  "PLR0913",  # op builders mirror their kernels' runtime arguments
  "PLR0917",  # same
  "C901",  # device code reads top to bottom like the kernels it drives
  "PLR0915",  # same
  "PLC0415",  # lazy imports keep ttnn and vLLM out of host-only paths
  "TRY003",  # messages stay at the raise site
  "EM101",  # same
  "EM102",  # same
  # Not yet fixed; remove one family per change.
  "ANN",  # annotations in src/
  "D",  # Google docstrings in src/
  "E501",  # docstrings and strings over the default width
  # Single rules with few findings each.
  "FBT001",
  "FBT002",
  "PT011",
  "PT018",
  "S101",
  "S310",
  "S311",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Scripts and tests are entry points, not API: no annotations or docstrings
# required, and they print and assert.
"scripts/**" = ["ANN", "D", "T201", "INP001", "S101", "SLF001"]
"tests/**" = ["ANN", "D", "INP001", "S101", "SLF001", "PLR2004"]
# The timed lambdas run within their own loop iteration.
"scripts/kernels/*" = ["ANN", "D", "T201", "INP001", "S101", "SLF001", "B023"]

[tool.ruff.format]
line-ending = "lf"
